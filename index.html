<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Matchday Sandbox: a fully customizable football league simulator.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B6B42'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
<title>Matchday Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a floodlit pitch band (mowing stripes + centre circle) over a calm green-paper workspace; every result is carried by a scoreboard chip. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --surface-2:#E8EDE4; --ink:#12211A; --muted:#566860; --line:#D1D9CC;
  --pitch:#1B6B42; --on-accent:#FFFFFF; --stripe-a:#0F4029; --stripe-b:#13512F; --on-pitch:#F4F8F2;
  --amber:#E7A812; --amber-soft:#FAEFC9; --amber-ink:#5A3F00;
  --q2:#7B58B8; --up:#238A50; --down:#C9443A; --qual:#2B69B3; --on-solid:#FFFFFF; --focus:#2B69B3;
  --score-bg:#0D3A24; --score-fg:#F4F8F2; --overlay:rgba(6,16,11,.62);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1511; --surface:#131E18; --surface-2:#1A2820; --ink:#E7EFE8; --muted:#92A59A; --line:#263629;
  --pitch:#37A56A; --on-accent:#05170E; --stripe-a:#0A2C1C; --stripe-b:#0D3723; --on-pitch:#EEF5EF;
  --amber:#EDB93A; --amber-soft:#2D2713; --amber-ink:#F3D27A;
  --q2:#A78BDB; --up:#46C27A; --down:#EE6F62; --qual:#6BA3E8; --on-solid:#05170E; --focus:#8DB8F0;
  --score-bg:#0A2217; --score-fg:#F1F7F2; --overlay:rgba(0,6,3,.72); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1511; --surface:#131E18; --surface-2:#1A2820; --ink:#E7EFE8; --muted:#92A59A; --line:#263629;
  --pitch:#37A56A; --on-accent:#05170E; --stripe-a:#0A2C1C; --stripe-b:#0D3723; --on-pitch:#EEF5EF;
  --amber:#EDB93A; --amber-soft:#2D2713; --amber-ink:#F3D27A;
  --q2:#A78BDB; --up:#46C27A; --down:#EE6F62; --qual:#6BA3E8; --on-solid:#05170E; --focus:#8DB8F0;
  --score-bg:#0A2217; --score-fg:#F1F7F2; --overlay:rgba(0,6,3,.72); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;min-height:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header band */
.band{background:repeating-linear-gradient(90deg,var(--stripe-a) 0 64px,var(--stripe-b) 64px 128px);color:var(--on-pitch);position:relative;overflow:hidden}
.band .wrap{position:relative;padding-block:28px 24px;display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.band .eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:14px;font-weight:600;opacity:.8}
.band h1{font-size:clamp(40px,7vw,68px);line-height:.95;text-transform:uppercase;font-weight:700;letter-spacing:.015em;margin-top:2px}
.band .sub{opacity:.82;margin-top:8px;font-size:14px}
.band .art{position:absolute;right:0;top:0;height:100%;width:min(46%,420px);opacity:.2;pointer-events:none}
.band .art *{fill:none;stroke:var(--on-pitch);stroke-width:2}
.band .headr{position:relative;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--on-pitch) 35%,transparent);background:color-mix(in srgb,var(--on-pitch) 10%,transparent);color:var(--on-pitch);font-weight:500}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}
.chip.warn i{background:var(--amber)}

/* tabs */
.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
.tabrow{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 9px;font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--amber)}
.tab:hover{color:var(--ink)}

main.wrap{padding-block:22px 64px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.2;min-height:38px}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 40%,var(--line))}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,var(--line))}
.btn.danger-solid{background:var(--down);border-color:var(--down);color:var(--on-solid)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lab{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;font-size:16px;min-width:0}
input[type=color]{width:100%;height:40px;padding:2px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
input[type=range]{width:100%;accent-color:var(--pitch)}
textarea{min-height:140px;resize:vertical;line-height:1.45}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--down);font-size:13.5px;min-height:1.2em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}

/* crests, flags */
.crest{width:var(--s);height:var(--s);object-fit:contain;flex:none;display:block}
.crest.ghost{border:1.5px dashed var(--line);border-radius:6px}
.flag{height:var(--s);width:calc(var(--s)*1.4);object-fit:contain;flex:none;border-radius:2px;display:inline-block;vertical-align:middle}
.flag.fb{display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:calc(var(--s)*.58);letter-spacing:.04em}
.lglogo{width:var(--s);height:var(--s);flex:none;border-radius:6px;object-fit:contain;display:inline-grid;place-items:center;background:var(--pitch);color:var(--on-accent);font-family:var(--f-display);font-weight:700;font-size:calc(var(--s)*.46);letter-spacing:.02em}

/* play layout */
.worldbar{display:flex;gap:14px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:18px}
.worldbar .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;text-transform:uppercase}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--pitch);border-radius:99px}
.wb-prog{min-width:200px;flex:1 1 220px}
.note{display:flex;gap:12px;justify-content:space-between;align-items:center;background:var(--amber-soft);color:var(--amber-ink);border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.playgrid{display:grid;grid-template-columns:248px minmax(0,1fr);gap:22px;align-items:start}
.picker{display:grid;gap:14px}
.pgroup{display:grid;gap:6px}
.plabel{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.plist{display:grid;gap:4px}
.pitem{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.pitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pitem em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pitem.on{border-color:var(--pitch);box-shadow:inset 0 0 0 1px var(--pitch);background:color-mix(in srgb,var(--pitch) 9%,var(--surface))}
@media(max-width:880px){
  .playgrid{grid-template-columns:minmax(0,1fr)}
  .picker{display:flex;overflow-x:auto;gap:18px;padding-bottom:6px}
  .pgroup{flex:none}.plist{display:flex}.pitem{flex:none}.pitem span{max-width:150px}
}
.lpanel{min-width:0;display:grid;gap:16px}
.lhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lh-main{flex:1;min-width:200px}
.lhead h2{font-size:clamp(28px,4vw,38px);line-height:1;text-transform:uppercase;font-weight:700}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:4px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ctl .grow{flex:1;min-width:150px}
.ctl .mdlab{font-family:var(--f-display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.champ{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 55%,var(--line));border-radius:8px;padding:14px 16px;color:var(--ink)}
.champ .lab{color:var(--amber-ink)}
.champ h3{font-size:30px;text-transform:uppercase;line-height:1;font-weight:700}
.champ .grow{flex:1;min-width:180px}
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.stab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:8px 14px 6px;font-family:var(--f-display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.stab.on{color:var(--ink);border-bottom-color:var(--pitch)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card-pad{padding:16px}

/* league table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table.league{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:0}
.league th{font-family:var(--f-display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.league td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-size:15px}
.league tr:last-child td{border-bottom:0}
.league th.l,.league td.l{text-align:left}
.league .c-pos{width:48px;text-align:left;padding-left:10px;white-space:nowrap}
.league .c-team{text-align:left;width:100%;max-width:0}
.league .pts{font-family:var(--f-display);font-size:20px;font-weight:700}
.pos{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px}
.pos.z-up{background:var(--up);color:var(--on-solid)}
.pos.z-q{background:var(--qual);color:var(--on-solid)}
.pos.z-q2{background:var(--q2);color:var(--on-solid)}
.pos.z-down{background:var(--down);color:var(--on-solid)}
.pos.z-champ{background:var(--amber);color:#2A1E00}
.mv{font-size:9px;margin-left:4px;vertical-align:middle}
.mv.up{color:var(--up)}.mv.down{color:var(--down)}
.tm{display:flex;align-items:center;gap:10px;background:none;border:0;padding:2px 0;text-align:left;min-width:0;max-width:100%}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tm:hover .nm{text-decoration:underline}
.fm{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;font-size:11px;font-weight:700;font-family:var(--f-display);margin-left:2px;color:var(--on-solid)}
.fm.W{background:var(--up)}.fm.D{background:var(--muted)}.fm.L{background:var(--down)}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:12px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:640px){.league .x{display:none}.league td,.league th{padding-inline:6px}}
@media(max-width:430px){.league .form{display:none}}

/* scoreboard chip + fixtures */
.score{display:inline-grid;grid-auto-flow:column;align-items:center;min-width:74px;background:var(--score-bg);color:var(--score-fg);border-radius:4px;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;overflow:hidden;font-variant-numeric:tabular-nums}
.score b{font-weight:700;padding:6px 0;text-align:center;min-width:30px}
.score i{width:1px;align-self:stretch;background:color-mix(in srgb,var(--score-fg) 28%,transparent)}
.score.pending{background:transparent;color:var(--muted);border:1px dashed var(--line);justify-content:center;padding:6px 0;font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.fxlist{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fx{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;text-align:left}
.fx:last-child{border-bottom:0}
.fx:hover{background:var(--surface-2)}
.side{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
.side.home{justify-content:flex-end;text-align:right}
.side .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sh{display:none;font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
@media(max-width:560px){.side .nm{display:none}.side .sh{display:inline}.fx{gap:8px}}
.roundbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.roundbar select{width:auto;min-width:190px;flex:1;max-width:320px}

/* stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.split{display:flex;height:26px;border-radius:5px;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--on-solid)}
.split span{display:grid;place-items:center;min-width:0;overflow:hidden}
.split .h{background:var(--pitch);color:var(--on-accent)}.split .d{background:var(--muted)}.split .a{background:var(--amber);color:#2A1E00}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.lists>*,.stack>*{min-width:0}
.li .nf,.li .cf{flex:none}
.li .hint.hx{white-space:nowrap}
@media(max-width:520px){.li .hint.hx{display:none}}
.awgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:12px}
.awc{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.awc.big{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.awp{display:flex;gap:10px;align-items:center;min-width:0}
.awc p{margin:0}
.pitch{position:relative;display:flex;flex-direction:column;justify-content:space-around;gap:14px;padding:22px 6px;min-height:420px;border-radius:14px;color:#fff;background:repeating-linear-gradient(0deg,#2f7d46 0 52px,#2a7340 52px 104px);overflow:hidden;margin-top:8px}
.pitch::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.5);border-radius:6px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:8px;right:8px;top:50%;border-top:2px solid rgba(255,255,255,.5);pointer-events:none}
.pr{position:relative;z-index:1;display:flex;justify-content:space-around;gap:4px}
.pn{background:none;border:0;color:#fff;display:grid;justify-items:center;gap:4px;flex:1 1 0;max-width:25%;min-width:0;padding:2px;font:inherit;cursor:pointer}
.pnm{font-size:12px;font-weight:700;max-width:100%;display:flex;align-items:center;justify-content:center;gap:4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pnm>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.list h4{font-size:17px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n{font-family:var(--f-display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.rate{display:grid;grid-template-columns:auto minmax(0,1fr) 34px;gap:10px;align-items:center;padding:5px 0}
.rate .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:90px;max-width:200px}
.rate .bar{margin:0;height:8px}
.rate .n{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:right}

/* cards grid */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.toolbar .field{flex:1 1 170px}
.toolbar .field.grow{flex:2 1 220px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.tcard:hover{border-color:var(--pitch)}
.tcard .tx{min-width:0;flex:1}
.tcard .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .sm{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.ovr{font-family:var(--f-display);font-weight:700;font-size:22px;min-width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.bigcard{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.bigcard .top{display:flex;gap:14px;align-items:center;min-width:0}
.bigcard h3{font-size:26px;text-transform:uppercase;line-height:1.05;font-weight:700;overflow-wrap:anywhere}
.stack{display:grid;gap:16px}
.pageh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pageh h2{font-size:34px;text-transform:uppercase;font-weight:700;line-height:1}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:8px;padding:32px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{font-size:26px;text-transform:uppercase}
.empty p{max-width:46ch;color:var(--muted)}

/* modal */

<script>
(function(){
'use strict';

// ==ENGINE START==
const Engine=(function(){
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const uid=()=>Math.random().toString(36).slice(2,10);
  function shuffle(a,rng){rng=rng||Math.random;for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function poisson(l,rng){rng=rng||Math.random;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rng();}while(p>L&&k<10);return k-1;}
  const DEFAULT_CFG={meetings:2,win:3,draw:1,loss:0,promote:2,relegate:2,qualify:0,qualLabel:'Qualification',tiebreak:'gdgf',goals:1.35,homeEdge:1.25,impact:1};
  function cfgOf(L){return Object.assign({},DEFAULT_CFG,(L&&L.cfg)||{});}
  function strength(t){const a=+t.att||50,m=+t.mid||50,d=+t.def||50;return{att:.65*a+.35*m,def:.65*d+.35*m};}
  function overall(t){return Math.round(((+t.att||50)+(+t.mid||50)+(+t.def||50))/3);}
  function lambdas(h,a,cfg){
    const hs=strength(h),as=strength(a),k=0.016*cfg.impact,G=cfg.goals,R=cfg.homeEdge;
    return[clamp(G*Math.sqrt(R)*Math.exp(k*(hs.att-as.def)),.12,5),clamp(G/Math.sqrt(R)*Math.exp(k*(as.att-hs.def)),.12,5)];
  }
  function simulate(h,a,cfg,rng){const l=lambdas(h,a,cfg);return[poisson(l[0],rng),poisson(l[1],rng)];}
  function odds(lh,la){
    const pm=l=>{const r=[];let p=Math.exp(-l);r.push(p);for(let k=1;k<=12;k++){p*=l/k;r.push(p);}return r;};
    const ph=pm(lh),pa=pm(la);let H=0,D=0,A=0;
    for(let i=0;i<=12;i++)for(let j=0;j<=12;j++){const p=ph[i]*pa[j];if(i>j)H+=p;else if(i===j)D+=p;else A+=p;}
    const s=H+D+A;return{h:H/s,d:D/s,a:A/s};
  }
  function makeRounds(ids,meetings,rng){
    const t=shuffle(ids.slice(),rng);if(t.length%2)t.push(null);
    const n=t.length,half=n/2,base=[];let arr=t.slice();
    for(let r=0;r<n-1;r++){
      const m=[];
      for(let i=0;i<half;i++){
        let a=arr[i],b=arr[n-1-i];if(a===null||b===null)continue;
        if((r+i)%2===1){const x=a;a=b;b=x;}
        m.push([a,b]);
      }
      base.push(m);
      arr=[arr[0],arr[n-1]].concat(arr.slice(1,n-1));
    }
    const rounds=[];
    for(let leg=0;leg<meetings;leg++){
      base.forEach(m=>rounds.push(m.map(p=>leg%2?{h:p[1],a:p[0],hg:null,ag:null}:{h:p[0],a:p[1],hg:null,ag:null})));
    }
    return rounds;
  }
  function newSeason(ids,meetings,year,rng){return{year:year,teams:ids.slice(),meetings:meetings,rounds:makeRounds(ids,meetings,rng)};}
  function counts(se){let p=0,t=0;se.rounds.forEach(r=>r.forEach(m=>{t++;if(m.hg!=null)p++;}));return{played:p,total:t};}
  function nextRound(se){for(let i=0;i<se.rounds.length;i++)if(se.rounds[i].some(m=>m.hg==null))return i;return -1;}
  function lastRound(se){let x=-1;se.rounds.forEach((r,i)=>{if(r.some(m=>m.hg!=null))x=i;});return x;}
  function playRound(se,ri,teamById,cfg,rng,evFn){se.rounds[ri].forEach(m=>{if(m.hg!=null)return;const s=simulate(teamById[m.h],teamById[m.a],cfg,rng);m.hg=s[0];m.ag=s[1];if(evFn)evFn(m);});}
  function playAll(se,teamById,cfg,rng,evFn){for(let i=0;i<se.rounds.length;i++)playRound(se,i,teamById,cfg,rng,evFn);}
  const TB={gdgf:(a,b)=>b.gd-a.gd||b.gf-a.gf,gfgd:(a,b)=>b.gf-a.gf||b.gd-a.gd,wgd:(a,b)=>b.w-a.w||b.gd-a.gd};
  function table(se,cfg,nameOf,skipRound){
    const rows={},list=[];
    se.teams.forEach(id=>{const r={id:id,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,form:[]};rows[id]=r;list.push(r);});
    se.rounds.forEach((rd,ri)=>{
      if(ri===skipRound)return;
      rd.forEach(m=>{
        if(m.hg==null||m.ag==null)return;const H=rows[m.h],A=rows[m.a];if(!H||!A)return;
        H.p++;A.p++;H.gf+=m.hg;H.ga+=m.ag;A.gf+=m.ag;A.ga+=m.hg;
        if(m.hg>m.ag){H.w++;A.l++;H.pts+=cfg.win;A.pts+=cfg.loss;H.form.push('W');A.form.push('L');}
        else if(m.hg<m.ag){A.w++;H.l++;A.pts+=cfg.win;H.pts+=cfg.loss;A.form.push('W');H.form.push('L');}
        else{H.d++;A.d++;H.pts+=cfg.draw;A.pts+=cfg.draw;H.form.push('D');A.form.push('D');}
      });
    });
    list.forEach(r=>{r.gd=r.gf-r.ga;r.form=r.form.slice(-5);});
    const tb=TB[cfg.tiebreak]||TB.gdgf;
    list.sort((a,b)=>b.pts-a.pts||tb(a,b)||String(nameOf(a.id)).localeCompare(String(nameOf(b.id))));
    list.forEach((r,i)=>{r.pos=i+1;});
    return list;
  }
  function stats(se){
    let played=0,goals=0,hw=0,dr=0,aw=0,total=0;const flat=[];
    se.rounds.forEach((rd,ri)=>rd.forEach(m=>{
      total++;if(m.hg==null)return;played++;goals+=m.hg+m.ag;

async function fileToDataURL(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('This file could not be read as an image.'));i.src=url;});

    w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let out=c.toDataURL('image/webp',.92);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/png');
    return out;
  }finally{URL.revokeObjectURL(url);}
}

function normalize(o){

  const lid={};

  o.teams.forEach(t=>{if(!t||!t.id)return;N.teams.push({id:String(t.id),name:String(t.name||'Team').slice(0,48),short:String(t.short||'').slice(0,4),city:String(t.city||'').slice(0,40),stadium:String(t.stadium||'').slice(0,48),nationId:nid[t.nationId]?t.nationId:null,leagueId:lid[t.leagueId]?t.leagueId:null,c1:safeColor(t.c1),c2:safeColor(t.c2),crest:img(t.crest),att:numIn(t.att,1,99,60),mid:numIn(t.mid,1,99,60),def:numIn(t.def,1,99,60),budget:Number.isFinite(+t.budget)&&t.budget!==null?+t.budget:null,anchor:Number.isFinite(+t.anchor)&&t.anchor!==null?+t.anchor:undefined,acad:t.acad>=1&&t.acad<=5?Math.round(t.acad):undefined,acSeed:t.acSeed?1:undefined});});
  const tid={};N.teams.forEach(t=>{tid[t.id]=1;});
  N.players=Array.isArray(o.players)?o.players.filter(p=>p&&p.id&&['GK','DF','MF','FW'].indexOf(p.pos)>=0).map(p=>({id:String(p.id),name:String(p.name||'Player').slice(0,40),pos:p.pos,age:Math.round(numIn(p.age,15,50,24)),ovr:Math.round(numIn(p.ovr,1,99,50)),pot:Math.round(numIn(p.pot,1,99,50)),teamId:tid[p.teamId]?p.teamId:null,nationId:nid[p.nationId]?p.nationId:null,contract:Math.round(numIn(p.contract,0,9,0)),career:Array.isArray(p.career)?p.career.slice(-60):[],tr:Array.isArray(p.tr)?p.tr.filter(x=>Array.isArray(x)&&x.length>=4).slice(-40):[],ret:p.ret?Math.round(numIn(p.ret,1800,2999,2026)):undefined,grad:p.grad?Math.round(numIn(p.grad,1800,2999,2026)):undefined,from:p.from?String(p.from):undefined,fn:p.fn?String(p.fn).slice(0,48):undefined})):null;
  N.academy=Array.isArray(o.academy)?o.academy.filter(a=>a&&a.id&&tid[a.teamId]&&['GK','DF','MF','FW'].indexOf(a.pos)>=0).map(a=>({id:String(a.id),teamId:a.teamId,name:String(a.name||'Prospect').slice(0,40),nationId:nid[a.nationId]?a.nationId:null,pos:a.pos,age:Math.round(numIn(a.age,14,21,16)),ovr:Math.round(numIn(a.ovr,1,99,30)),pot:Math.round(numIn(a.pot,1,99,60)),yr:Math.round(numIn(a.yr,1800,2999,2026))})).slice(0,3000):undefined;
  N.log=Array.isArray(o.log)?o.log.slice(0,400):[];
  N.awards=Array.isArray(o.awards)?o.awards.filter(a=>a&&a.lid&&Number.isFinite(a.y)).slice(-600):[];
  N.worldAwards=Array.isArray(o.worldAwards)?o.worldAwards.filter(a=>a&&Number.isFinite(a.y)&&Array.isArray(a.poy)).slice(-60):[];
  N.settings=Object.assign({budgets:true,autoWindow:true,names:'world',academy:true},o.settings&&typeof o.settings==='object'?o.settings:{});
  N.cups=Array.isArray(o.cups)?o.cups.filter(c=>c&&c.id&&['domestic','club','nations'].indexOf(c.kind)>=0).map(c=>({id:String(c.id),name:String(c.name||'Cup').slice(0,48),kind:c.kind,nationId:nid[c.nationId]?c.nationId:null,maxTier:Math.round(numIn(c.maxTier,0,9,0)),leagueIds:(c.leagueIds||[]).filter(x=>lid[x]),nationIds:(c.nationIds||[]).filter(x=>nid[x]),logo:img(c.logo),every:Math.round(numIn(c.every,1,20,1)),offset:Math.round(numIn(c.offset,1800,2999,N.year)),afterQ:!!c.afterQ,spots:Math.round(numIn(c.spots,0,9,0)),fmt:Object.assign({},Engine.DEFAULT_FMT,c.fmt||{}),comp:c.comp&&typeof c.comp==='object'&&c.comp.stage?c.comp:null,history:Array.isArray(c.history)?c.history:[]})):null;
  N.leagues.forEach(L=>{
    if(!L.season)return;
    const ids=N.teams.filter(t=>t.leagueId===L.id).map(t=>t.id).sort().join(',');
    if(L.season.teams.slice().sort().join(',')!==ids)L.season=null;

  Engine.ensurePlayers(N);

function cupView(c){

  }else if(active){
    const label=k.stage==='group'?(k.swiss?'League phase':'Group stage'):k.stage==='po'?k.po.name:k.ko[k.ko.length-1].name;
    top=`<div class="ctl"><div class="grow"><span class="mdlab">${esc(label)}</span><p class="hint">Plays the next round for every tie or group together.</p></div><button class="btn primary" data-action="cup-step" data-id="${c.id}">Play next round</button><button class="btn" data-action="cup-finish" data-id="${c.id}">Finish edition</button></div>`;

function swissHTML(c,k){

function cupGroups(c,k){
  if(k.swiss)return'<div class="groups"><div style="grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:760px;min-width:0">'+swissHTML(c,k)+'</div></div>';
  const f=Engine.cupFmt(c),tabs=Engine.groupTables(k);
  return`<div class="groups">${k.groups.map((g,gi)=>{
    const rows=tabs[gi].map(r=>`<tr><td><span class="pos ${r.pos<=f.advance?'z-q':''}">${r.pos}</span></td><td><span class="row" style="gap:8px;flex-wrap:nowrap">${entCrest(r.id,20)}<span style="font-weight:600">${entLnk(r.id,entName(r.id,k))}</span></span></td><td class="r">${r.p}</td><td class="r">${r.w}-${r.d}-${r.l}</td><td class="r">${signed(r.gd)}</td><td class="r"><b>${r.pts}</b></td></tr>`).join('');
    const ms=[];g.rounds.forEach(rd=>rd.forEach(m=>{if(m.hg!=null)ms.push(`<div class="resline" style="grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)"><span style="text-align:right">${esc(entShort(m.h,k))}</span><b>${m.hg}-${m.ag}</b><span>${esc(entShort(m.a,k))}</span></div>`);}));
    return`<div class="card" style="padding:12px"><h4 style="font-size:20px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Group ${String.fromCharCode(65+gi)}</h4><div class="scroll"><table class="mini"><thead><tr><th></th><th>Team</th><th class="r">P</th><th class="r">W-D-L</th><th class="r">GD</th><th class="r">Pts</th></tr></thead><tbody>${rows}</tbody></table></div>${ms.length?`<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Results (${ms.length})</summary>${ms.join('')}</details>`:''}</div>`;}).join('')}</div><div class="legend"><span><b style="background:var(--qual)"></b>Advance to the knockout round</span></div>`;

function cupKoList(c,k){

function bracketHTML(c,k){
  const f=Engine.cupFmt(c),CW=216,CH=56,GAP=46,PITCH=CH+16,TOP=30;
  let n0;
  if(k.ko)n0=k.ko[0].ties.length;
  else if(k.swiss)n0=Engine.swissPlan(k.entrants.length).K/2;
  else{let q=Math.max(2,k.groups.length*f.advance),pw=1;while(pw<q)pw*=2;n0=pw/2;}
  const R=Math.round(Math.log2(n0))+1,rounds=[];
  for(let r=0;r<R;r++){
    const cnt=n0>>r,ex=k.ko&&k.ko[r];
    rounds.push({name:ex?ex.name:Engine.koName(cnt*2),ties:ex?ex.ties:new Array(cnt).fill(null)});
  }
  const cy=(r,i)=>TOP+(i+0.5)*PITCH*Math.pow(2,r),colX=r=>r*(CW+GAP);
  const W=R*(CW+GAP)+CW,H=TOP+n0*PITCH;
  const aggOf=t=>{let x=0,y=0;t.legs.forEach(m=>{if(m.h===t.a){x+=m.hg;y+=m.ag;}else{x+=m.ag;y+=m.hg;}});return[x,y];};
  const row=(id,t,isA)=>{
    if(id==null)return`<div class="br tbd"><span class="nm">To be decided</span></div>`;
    let sc='';
    if(t&&t.legs&&t.legs.length){const a=aggOf(t);sc=String(isA?a[0]:a[1])+(t.pen?' <small>('+(isA?t.pen[0]:t.pen[1])+')</small>':'');}
    return`<div class="br ${t&&t.w===id?'win':''}">${entCrest(id,20)}<span class="nm">${entLnk(id,entName(id,k))}</span><span class="sc">${sc}</span></div>`;
  };
  let lines='',cards='',labels='';
  const won=[],rest=[];
  rounds.forEach((rd,r)=>{
    labels+=`<div class="brk-lab" style="left:${colX(r)}px;top:0;width:${CW}px">${esc(rd.name)}</div>`;
    rd.ties.forEach((t,i)=>{
      const y=cy(r,i),top=y-CH/2;
      const a=t?t.a:null,b=t?(t.bye?null:t.b):null;
      let body,title='';
      if(t&&t.bye){body=row(a,t,true)+`<div class="br tbd"><span class="nm">Bye</span></div>`;}
      else body=row(a,t,true)+row(b,t,false);
      if(t&&t.legs&&t.legs.length){title=t.legs.map(m=>entShort(m.h,k)+' '+m.hg+'-'+m.ag+' '+entShort(m.a,k)+(m.et?' aet':'')).join(', ')+(t.pen?', pens '+t.pen[0]+'-'+t.pen[1]:'');}
      cards+=`<div class="bt ${t&&t.w!=null?'done':''}" style="left:${colX(r)}px;top:${top}px;width:${CW}px;height:${CH}px" title="${esc(title)}">${body}</div>`;
      if(r<R-1){
        const x1=colX(r)+CW,x2=colX(r+1),xm=x1+GAP/2,y2=cy(r+1,i>>1);
        (t&&t.w!=null?won:rest).push(`M${x1} ${y}H${xm}V${y2}H${x2}`);
      }
    });
  });
  const fin=rounds[R-1].ties[0],fy=cy(R-1,0),cx=colX(R);
  let champ='';
  if(k.champion!=null){
    won.push(`M${colX(R-1)+CW} ${fy}H${cx}`);
    champ=`<div class="bt champ" style="left:${cx}px;top:${fy-CH/2}px;width:${CW}px;height:${CH}px"><div class="br win">${entCrest(k.champion,30)}<span style="flex:1;min-width:0;display:grid;line-height:1.2"><span class="lab" style="color:var(--amber-ink)">${tic(cupKey(c),14)}Champion</span><span class="nm" style="font-size:15px">${entLnk(k.champion,entName(k.champion,k))}</span></span></div></div>`;
  }
  const svg=`<svg class="brk-lines" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${rest.join('')}"/><path class="won" d="${won.join('')}"/></svg>`;
  const note=k.ko?'':'<p class="hint" style="margin-bottom:8px">'+(k.swiss?'The bracket fills in when the league phase and the play-offs end.':'The bracket fills in when the group stage ends.')+'</p>';
  return note+`<div class="brkwrap"><div class="brk" style="width:${W}px;height:${H}px">${svg}${labels}${cards}${champ}</div></div>`;
}

// ===== national teams =====
const natOf=id=>'nat:'+id;
function natHonours(n){
  const tid=natOf(n.id),out={titles:[],finals:[],eds:[]};
  (S.cups||[]).filter(c=>c.kind==='nations').forEach(c=>(c.history||[]).forEach(h=>{
    const res=h.res?h.res[tid]:(h.champ===tid?'Winner':h.ru===tid?'Final':null);
    if(!res)return;
    out.eds.push({y:h.y,n:c.name,res:res,fs:h.fs});
    if(h.champ===tid)out.titles.push({y:h.y,n:c.name});else if(h.ru===tid)out.finals.push({y:h.y,n:c.name});
  }));
  out.eds.sort((a,b)=>b.y-a.y);return out;
}
function natAwards(n){
  const out={l:{},w:{},xi:0,wxi:0};
  (S.awards||[]).forEach(a=>{['mvp','boot','assist','young','glove'].forEach(k=>{if(a[k]&&a[k].nid===n.id)out.l[k]=(out.l[k]||0)+1;});out.xi+=(a.xi||[]).filter(e=>e.nid===n.id).length;});
  (S.worldAwards||[]).forEach(a=>{if(a.poy&&a.poy[0]&&a.poy[0].nid===n.id)out.w.poy=(out.w.poy||0)+1;['young','boot','assist','glove'].forEach(k=>{if(a[k]&&a[k].nid===n.id)out.w[k]=(out.w[k]||0)+1;});out.wxi+=(a.xi||[]).filter(e=>e.nid===n.id).length;});
  return out;
}
function natInfo(){
  const ix=idx(),rows=S.nations.map(n=>{
    const sq=Engine.nationalSquad(S,n.id,ix),r=Engine.rateRoster(sq),ok=sq.length>=11;
    return{n:n,sq:sq,r:r,ok:ok,ovr:ok?Math.round((r.att+r.mid+r.def)/3):0,h:natHonours(n),best:ix.all.filter(p=>p.nationId===n.id).sort((a,b)=>b.ovr-a.ovr)[0]||null};
  });
  rows.slice().sort((a,b)=>b.ovr-a.ovr||b.h.titles.length-a.h.titles.length).forEach((r,i)=>{r.rank=r.ok?i+1:null;});

}

  const grp=(arr,mk)=>{const g={},ord=[];arr.forEach(x=>{if(!g[x.n]){g[x.n]={n:x.n,ys:[]};ord.push(x.n);}g[x.n].ys.push(x.y);});return ord.map(k=>g[k]).map(mk);};
  const team=grp(h.titles,x=>({ic:cupKeyByName(x.n,'n'),cls:'green',n:x.ys.length,t:x.n,s:'Tournament winners · '+yearsStr(x.ys)}))
    .concat(grp(h.finals,x=>({ic:'runner',cls:'silver',n:x.ys.length,t:x.n,s:'Runners-up · '+yearsStr(x.ys)})));
  const ind=[];
  ['poy','boot','assist','young','glove'].forEach(k=>{if(aw.w[k])ind.push({ic:awKey(k,true),cls:'world',n:aw.w[k],t:awLabel(k,true),s:'Won by a '+esc(n.name)+' player'});});
  if(aw.wxi)ind.push({ic:'xi',cls:'world',n:aw.wxi,t:awLabel('xi',true),s:'Players picked'});
  ['mvp','boot','assist','young','glove'].forEach(k=>{if(aw.l[k])ind.push({ic:awKey(k,false),cls:'blue',n:aw.l[k],t:awLabel(k,false),s:'League awards won by nationals'});});
  if(aw.xi)ind.push({ic:'xi',cls:'blue',n:aw.xi,t:awLabel('xi',false),s:'League teams of the season'});
  const cab=cabinetHTML(team,ind,'','No trophies yet. Win a nations tournament and it is kept here, with the awards its players earn.');
  const nT=h.titles.length,nF=h.finals.length;
  const pills=[r.rank?`<span class="hpill">World rank #${r.rank}</span>`:'',nT?`<span class="hpill">${nT} ${nT===1?'title':'titles'}</span>`:'',nF?`<span class="hpill">${nF} ${nF===1?'final':'finals'} lost</span>`:''].join('');
  const rate=(lab,v)=>`<div class="rate"><span class="nm lab" style="min-width:90px">${lab}</span><div class="bar"><i style="width:${v}%"></i></div><span class="n">${v}</span></div>`;
  const best=h.eds.reduce((m,e)=>e.res==='Winner'?1:e.res==='Final'?Math.max(m,2):m,0);
  const tiles=`<div class="statgrid"><div class="tile"><span class="lab">Titles</span><div class="v">${nT}</div></div><div class="tile"><span class="lab">Finals</span><div class="v">${nT+nF}</div></div><div class="tile"><span class="lab">Tournaments</span><div class="v">${h.eds.length}</div><span class="hint">${best===1?'Best: champions':best===2?'Best: final':h.eds.length?'Best: '+esc(h.eds[0].res):'None played yet'}</span></div></div>`;
  const rec=h.eds.length?`<div class="list"><div class="sec"><h4>Tournament record</h4></div><div class="card scroll" style="margin-top:6px"><table class="mini"><thead><tr><th>Season</th><th>Tournament</th><th>Result</th></tr></thead><tbody>${h.eds.slice(0,12).map(e=>`<tr><td>${sLabel(e.y)}</td><td>${esc(e.n)}</td><td>${RESPILL(e.res)}</td></tr>`).join('')}</tbody></table></div></div>`:'';
  const xi=r.ok?`<div class="list"><div class="sec"><h4>${tic('xi',18)}Starting XI</h4></div>${pitchHTML(natXI(sq))}</div>`:'';
  const legends=(S.players||[]).filter(p=>p.nationId===n.id).map(p=>({p:p,g:(p.career||[]).reduce((s,c)=>s+c.g,0)})).filter(x=>x.g>0).sort((a,b)=>b.g-a.g).slice(0,6).map(x=>`<div class="li">${posB(x.p.pos)}<button type="button" class="lnk nm" data-action="open-player" data-id="${x.p.id}">${esc(x.p.name)}</button><span class="hint">${x.p.ret?'Retired '+sLabel(x.p.ret):(teamById(x.p.teamId)||{}).name||'Free agent'}</span><span class="n" title="Career goals">${x.g}</span></div>`).join('');
  const legH=legends?`<div class="list card card-pad"><h4>${tic('boot',18)}All-time top scorers</h4>${legends}</div>`:'';
  const rows=sq.slice().sort((a,b)=>POSORD[a.pos]-POSORD[b.pos]||b.ovr-a.ovr).map(p=>`<tr><td>${posB(p.pos)}</td><td><button type="button" class="lnk" data-action="open-player" data-id="${p.id}">${esc(p.name)}</button></td><td>${clubCell(p)}</td><td class="r">${p.age}</td><td class="r"><b>${p.ovr}</b></td></tr>`).join('');
  const hero=`<div class="hero" style="--hbg:${heroBg({c1:n.color})};border-bottom-color:${safeColor(n.color)}"><button type="button" class="btn sm x" data-close>Close</button><span class="hc">${flag(n,64)}</span><div class="hi"><p class="meta" style="margin:0"><span>${esc(n.code||'')}</span><span>·</span><span>National team</span></p><h3>${esc(n.name)}</h3><p class="hs">${r.ok?'Attack '+r.r.att+' · Midfield '+r.r.mid+' · Defence '+r.r.def:'Needs 11 eligible players. Eligible now: '+sq.length}</p>${pills?`<p class="hp">${pills}</p>`:''}</div><div class="ring" style="--v:${r.ovr}" title="Squad rating"><span>${r.ok?r.ovr:'-'}</span></div></div>`;
  openModal(`${hero}<div class="sh-body">${tiles}${cab}${r.ok?`<div class="card card-pad" style="padding-top:8px;padding-bottom:8px">${rate('Attack',r.r.att)}${rate('Midfield',r.r.mid)}${rate('Defence',r.r.def)}<p class="hint">Built from the best players of this nationality, wherever they play.</p></div>`:''}${xi}${rec}${legH}${sq.length?`<div class="list"><div class="sec"><h4>Squad</h4><span class="cnt">${sq.length}</span></div><div class="card scroll" style="margin-top:6px"><table class="mini"><thead><tr><th></th><th>Player</th><th>Club</th><th class="r">Age</th><th class="r">OVR</th></tr></thead><tbody>${rows}</tbody></table></div></div>`:''}</div><div class="sh-foot"><button class="btn" data-action="edit-nation" data-id="${n.id}">Edit nation</button></div>`,{title:n.name+' national team',wide:true});
};
// ---- ui-academy end

// ===== events
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab');if(tab){ui.tab=tab.dataset.tab;render();window.scrollTo(0,0);return;}
  const el=e.target.closest('[data-action]');if(!el)return;
  const fn=A[el.dataset.action];if(fn)fn(el,e);
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ui.q=e.target.value;$('#teamList').innerHTML=teamListHTML();}
  else if(e.target.id==='pq'){ui.pq=e.target.value;ui.pMore=1;$('#playerList').innerHTML=playerListHTML();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='pp'||t.id==='pn'||t.id==='pc'||t.id==='ps'){({pp:()=>{ui.pPos=t.value;},pn:()=>{ui.pNation=t.value;},pc:()=>{ui.pClub=t.value;},ps:()=>{ui.pSort=t.value;}})[t.id]();ui.pMore=1;$('#playerList').innerHTML=playerListHTML();}
  else if(t.id==='acClub'||t.id==='acPos'||t.id==='acSort'){ui[t.id]=t.value;render();}
  else if(t.id==='awY'){ui.awY=+t.value;render();}
  else if(t.id==='awS'){ui.awS=t.value;render();}
  else if(t.id==='nameMode'){S.settings=S.settings||{};S.settings.names=t.value;saveSoon();}
  else if(t.id==='setBud'||t.id==='setAuto'){S.settings=S.settings||{};if(t.id==='setBud')S.settings.budgets=t.checked;else S.settings.autoWindow=t.checked;saveSoon();}
  else if(t.id==='fn'){ui.fNation=t.value;$('#teamList').innerHTML=teamListHTML();}
  else if(t.id==='fl'){ui.fLeague=t.value;$('#teamList').innerHTML=teamListHTML();}
  else if(t.id==='ts'){ui.tSort=t.value;ui.tDir=1;render();}
  else if(t.id==='roundSel'){ui.round=+t.value;render();}
  else if(t.id==='importFile'){
    const f=t.files[0];t.value='';if(!f)return;
    const rd=new FileReader();
    rd.onload=async()=>{
      let N;try{N=normalize(JSON.parse(rd.result));}catch(err){toast(err.message&&err.message.indexOf('Matchday')===0?err.message:'That file could not be read.');return;}
      const ok=await confirmDialog({title:'Replace your world?',body:'Importing replaces the current world with <b>'+N.nations.length+' nations, '+N.leagues.length+' leagues and '+N.teams.length+' teams</b>.',ok:'Import',danger:true});if(!ok)return;
      S=N;ui.leagueId=null;ui.round=null;ui.tab='play';commit();toast('World imported');
    };
    rd.readAsText(f);
  }
});

// ===== boot
(async function boot(){
  paintSave();
  const [saved,def]=await Promise.all([loadSaved(),fetchDefault()]);
  DEFAULT_WORLD=def;
  if(saved&&Array.isArray(saved.teams)){try{S=normalize(saved);S.demo=!!saved.demo;saveStatus=saveStatus==='memory'?'memory':'saved';}catch(e){S=null;}}
  if(!S&&def){try{S=normalize(JSON.parse(JSON.stringify(def)));S.demo=false;if(saveStatus!=='memory')saveStatus='saving';saveSoon();}catch(e){S=null;}}
  if(!S){S=Engine.demoWorld();if(saveStatus!=='memory')saveStatus='saving';saveSoon();}
  Engine.syncSeasons(S);Engine.syncComps(S);
  render();
})();
})();
</script>
